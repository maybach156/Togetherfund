<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming payment — TogetherFund</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap" style="padding:90px 0"><h1>Confirming your contribution…</h1><p id="result">Please wait while we verify your payment with Paystack.</p><a class="btn primary" href="/">Return to TogetherFund</a></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get("reference");const token=localStorage.getItem("tf_token");const el=document.getElementById("result");if(!ref||!token){el.textContent="Payment reference or login session is missing. Contact support with your payment receipt.";return;}try{const r=await fetch("/api/paystack-verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({reference:ref})});const d=await r.json();el.textContent=r.ok?"Thank you! Your contribution payment has been verified.":(d.error||"We could not confirm this payment. Please contact support.");}catch(e){el.textContent="Could not verify right now. Please try again later.";}})();
</script></body></html>
